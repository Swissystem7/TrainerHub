<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" role="img" aria-label="Pull-Up Exercise Icon">
  <!-- Bar Equipment -->
  <line x1="8" y1="18" x2="56" y2="18" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="18" x2="12" y2="8" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="52" y1="18" x2="52" y2="8" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Hands / Grip Points -->
  <circle cx="22" cy="18" r="2.5" fill="#B9F24A"/>
  <circle cx="42" cy="18" r="2.5" fill="#B9F24A"/>

  <!-- Athlete Head (Chin Above Bar) -->
  <circle cx="32" cy="11" r="4.5" fill="#F6F8F6"/>

  <!-- Arms / Shoulders in Flexed Pull -->
  <!-- Left Arm: Hand (22,18) -> Elbow (17,25) -> Shoulder (26,20) -->
  <path d="M22 18 L18 26 L27 21" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Arm: Hand (42,18) -> Elbow (46,25) -> Shoulder (37,20) -->
  <path d="M42 18 L46 26 L37 21" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Torso / Spine -->
  <path d="M32 20 L32 38" stroke="#B9F24A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Legs (Hollow Body / Calisthenics Form) -->
  <path d="M32 38 L30 49 L29 58" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 38 L34 49 L35 58" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upward Kinetic Energy Indicators -->
  <path d="M22 34 L22 30" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 34 L42 30" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
</svg>
