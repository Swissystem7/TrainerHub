name: Set Repository Topics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Set topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT /repos/${{ github.repository }}/topics \
            -H "Accept: application/vnd.github+json" \
            -f "names[]=fitness" \
            -f "names[]=workout-planner" \
            -f "names[]=training" \
            -f "names[]=python" \
            -f "names[]=javascript" \
            -f "names[]=browser-only" \
            -f "names[]=hebrew"
