name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install
      # --with-deps apt-gets fonts from archive.ubuntu.com. That DNS lookup
      # failed twice on ubuntu-26.04 and ate the job before npm test ran.
      # Install the browser first. Ask apt for system packages only if
      # Chromium cannot launch with the libraries already on the image.
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npx playwright install chromium
          if node -e "const {chromium}=require('playwright'); chromium.launch().then(b=>b.close()).catch(e=>{console.error(e); process.exit(1)})"; then
            exit 0
          fi
          echo "Chromium failed to launch; installing system dependencies"
          npx playwright install-deps chromium
          node -e "const {chromium}=require('playwright'); chromium.launch().then(b=>b.close())"
      - run: npm test
