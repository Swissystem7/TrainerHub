name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile the backend
        run: python -m compileall -q backend

  frontend:
    name: frontend pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check inline scripts in every page
        run: |
          node -e "
            const fs=require('fs');
            let total=0;
            for (const page of ['index.html','frontend/index.html','frontend/workout-mode.html']) {
              const html=fs.readFileSync(page,'utf8');
              const inline=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]);
              inline.forEach(x=>new Function(x));
              total+=inline.length;
              console.log(page+': '+inline.length+' inline scripts OK');
            }
            if(!total) throw new Error('no inline scripts found at all');
          "

  contract:
    name: demo and validator agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The fallback every visitor without an API key sees must pass the same
      # validator the model's output goes through.
      - name: The shipped demo workout must validate
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'backend')
          from demo_workout import DEMO_WORKOUT
          from parser import validate_workout
          problems = validate_workout(DEMO_WORKOUT)
          if problems:
              raise SystemExit('demo workout is invalid: ' + '; '.join(problems))
          print('OK: the demo workout validates')
          PY
