<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" role="img" aria-label="Muscle-Up Exercise Icon">
  <!-- Horizontal High Bar -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="12" y2="60" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="52" y1="32" x2="52" y2="60" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Hands Gripping Down on the Bar (Top Support) -->
  <circle cx="22" cy="32" r="2.5" fill="#B9F24A"/>
  <circle cx="42" cy="32" r="2.5" fill="#B9F24A"/>

  <!-- Athlete Head (Elevated High Above Bar) -->
  <circle cx="32" cy="10" r="4.5" fill="#F6F8F6"/>

  <!-- Shoulders & Upper Body Raised Above the Bar -->
  <path d="M25 18 L32 19 L39 18" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms in Straight-Bar Transition / Lockout -->
  <path d="M25 18 L19 25 L22 32" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39 18 L45 25 L42 32" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Core / Torso Pressing Through -->
  <line x1="32" y1="19" x2="32" y2="34" stroke="#B9F24A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Calisthenics Hollow Legs Extending Downwards -->
  <path d="M32 34 L31 46 L28 58" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 34 L33 46 L30 58" stroke="#F6F8F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Dynamic Curved Momentum Arrow (Pull -> Transition -> Push Over Bar) -->
  <path d="M12 40 C10 26, 16 14, 22 12" stroke="#B9F24A" stroke-width="2" stroke-dasharray="2 3" stroke-linecap="round"/>
  <path d="M20 10 L24 12 L21 16" stroke="#B9F24A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
