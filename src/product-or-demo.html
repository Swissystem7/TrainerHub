<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <meta name="description" content="סיווג מערכת TrainerHub: האם זה מוצר או כלי הדגמה למאמנים.">
  <title>TrainerHub | סיווג מערכת: מוצר או הדגמה</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    .wrap { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: 700; margin-bottom: 8px; }
    .status-badge.product { background: #dcfce7; color: #166534; }
    .status-badge.demo { background: #fef9c3; color: #854d0e; }
    .status-desc { font-size: 1.05rem; line-height: 1.5; margin: 8px 0 16px; }
    .status-capabilities { list-style: none; padding: 0; margin: 12px 0; }
    .status-capabilities li { padding: 4px 0; font-size: 0.95rem; }
  </style>
</head>
<body class="th-ds">
  <nav class="th-nav no-print" aria-label="ניווט ראשי">
    <span class="brand">TrainerHub</span>
    <a href="../index.html">בונה אימון</a>
    <a href="../weekly.html">בונה שבועי</a>
    <a href="../offer.html">הצעה למאמנים</a>
    <a href="../pitch.html">דף אחד להדפסה</a>
  </nav>
  <main class="wrap">
    <header>
      <small>TRAINERHUB · שקיפות מערכת</small>
      <h1 id="pageTitle">האם זה מוצר או הדגמה?</h1>
      <p id="purposeLead" class="lead"></p>
    </header>
    <section class="card" aria-labelledby="pageTitle">
      <div id="statusContainer" role="region" aria-live="polite"></div>
      <button type="button" id="refreshBtn" class="th-btn ghost" aria-label="רענן סיווג מערכת">רענן סיווג</button>
    </section>
  </main>
  <script src="./product-or-demo.js"></script>
  <script>
    (function () {
      var THPOD = window.THProductOrDemo;
      if (!THPOD) return;
      var lead = document.getElementById('purposeLead');
      var container = document.getElementById('statusContainer');
      var refreshBtn = document.getElementById('refreshBtn');
      if (lead) {
        lead.textContent = 'מטרת הפרויקט: ' + THPOD.projectPurpose();
      }
      function refresh() {
        THPOD.renderProductStatus(container);
      }
      if (refreshBtn) {
        refreshBtn.addEventListener('click', refresh);
      }
      refresh();
    })();
  </script>
</body>
</html>
