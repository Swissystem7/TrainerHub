<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" role="img" aria-label="Push-Up Exercise Icon">
  <!-- Ground Line / Park Floor -->
  <line x1="8" y1="48" x2="56" y2="48" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="52" x2="50" y2="52" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Hands / Contact Point -->
  <circle cx="20" cy="48" r="2.5" fill="#B9F24A"/>

  <!-- Feet / Toes Contact -->
  <circle cx="52" cy="46" r="2" fill="#2DD4BF"/>

  <!-- Athlete Head -->
  <circle cx="12" cy="28" r="4.5" fill="#F6F8F6"/>

  <!-- Arm in Push Position: Hand (20, 48) -> Elbow (15, 39) -> Shoulder (22, 33) -->
  <path d="M20 48 L15 39 L22 33" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Straight Body Alignment (Core & Legs) -->
  <!-- Torso / Spine: Shoulder (22, 33) to Hip (34, 37) -->
  <line x1="22" y1="33" x2="35" y2="37" stroke="#B9F24A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Legs: Hip (35, 37) -> Knee (44, 41) -> Ankle/Heel (52, 46) -->
  <path d="M35 37 L44 41 L52 46" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Push Dynamics / Upward Arrow -->
  <path d="M22 23 L22 17" stroke="#B9F24A" stroke-width="2" stroke-linecap="round"/>
  <path d="M19 19 L22 16 L25 19" stroke="#B9F24A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
