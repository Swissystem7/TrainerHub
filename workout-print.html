<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <meta name="description" content="דף אימון להדפסה או לשמירה כ־PDF. בלי שמות קבצים.">
  <title>TrainerHub | דף אימון להדפסה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
  <link rel="stylesheet" href="./css/app.css">
  <style>
    :root { --bg:var(--th-bg); --card:var(--th-surface); --line:var(--th-line); --ink:var(--th-ink); --muted:var(--th-muted); --lime:var(--th-teal); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--th-bg); color: var(--ink); font-family: var(--th-font); }
    .wrap { max-width: 760px; margin: auto; padding: 20px 16px 64px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 16px; }
    .toolbar .field { flex: 1; min-width: 180px; }
    label { display: block; color: var(--muted); font-size: .82rem; margin-bottom: 6px; }
    input {
      width: 100%; min-height: 48px; padding: 10px 14px; border-radius: var(--th-r-sm); border: 1.5px solid var(--line);
      background: var(--th-surface); color: var(--ink); font: inherit;
    }
    .empty { color: var(--muted); padding: 24px 0; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
    .th-btn[disabled], .th-btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; pointer-events: none; }
    .print-sheet table { width: 100%; border-collapse: collapse; }
    .print-sheet th, .print-sheet td { overflow-wrap: break-word; word-break: break-word; }
    @media print {
      body { background: #fff; color: #111; }
      /* biome-ignore lint/complexity/noImportantStyles: print override */
      .no-print, .th-nav, .toolbar, button { display: none !important; }
      .print-sheet { color: #111; }
      .print-sheet th, .print-sheet td { border-bottom-color: #ccc; color: #111; }
      .print-phase, .print-sheet tr, .print-sheet table { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="th-ds">
<a class="skip-link no-print" href="#sheet">דלג לדף האימון</a>
<nav class="th-nav no-print" aria-label="ניווט ראשי">
  <span class="brand">TrainerHub</span>
  <a href="./">בנה אימון</a>
  <a href="./weekly.html">בונה שבועי</a>
  <a href="./library.html">ספריית סרטונים</a>
  <a href="./exercises.html">ספריית תרגילים</a>
  <a href="./journal.html">יומן ביצוע</a>
  <a href="./booklet.html">תיק בטיחות</a>
  <a href="./offer.html">הצעה למאמנים</a>
  <span class="chip on">דף להדפסה</span>
  <a href="./manage.html">ניהול מאגר</a>
  <a href="./frontend/">טקסט לכרטיסייה</a>
</nav>
<main class="wrap">
  <form class="toolbar no-print" id="brandForm" role="toolbar" aria-label="הגדרות הדפסה ומיתוג אימון">
    <div class="field">
      <label for="brand">שם המאמן / הסטודיו על הדף (רק במסלול מאמן)</label>
      <input id="brand" name="brand" type="text" maxlength="60" autocomplete="organization" placeholder="יופיע רק אחרי קוד גישה" aria-label="שם המאמן או הסטודיו בדף ההדפסה">
    </div>
    <button type="submit" class="th-btn ghost" id="updateBrandBtn" aria-label="עדכן שם מאמן או סטודיו">עדכן שם</button>
    <button type="button" class="th-btn" id="printBtn" aria-label="הדפס את דף האימון או שמור כ־PDF">הדפס / שמור כ־PDF</button>
    <a class="th-btn ghost" id="backBtn" href="./" aria-label="חזרה לבונה האימון">חזרה לבונה</a>
    <a class="th-btn ghost" href="./offer.html" aria-label="מעבר למידע על מסלול מאמן">מסלול מאמן</a>
  </form>
  <p class="honest no-print" id="hint" role="status" aria-live="polite" style="color:#a7b1ab;font-size:.88rem;line-height:1.5"></p>
  <!-- biome-ignore lint/a11y/useSemanticElements: printable sheet region -->
  <div id="sheet" role="region" aria-label="תצוגת דף אימון להדפסה"></div>
</main>
<script src="./js/core.js"></script>
<script>
(() => {
  var $ = (id) => document.getElementById(id);

  // A stored entry counts as a workout only when it has phases to print;
  // {} (saved by «עדכן שם» before any workout existed) must not shadow
  // the active workout or the «אין אימון» message.
  function isWorkout(w) {
    return !!(w && typeof w === 'object' && Array.isArray(w.phases) && w.phases.length);
  }

  function savedBrand() {
    var packed = TH.store.get(TH.KEYS.print, null);
    return packed?.brand ? String(packed.brand) : '';
  }

  function currentWorkout() {
    var packed = TH.store.get(TH.KEYS.print, null);
    if (packed && isWorkout(packed.workout)) return packed;
    var active = TH.store.get(TH.KEYS.active, null);
    if (isWorkout(active)) return { workout: active, brand: savedBrand(), client: '' };
    return null;
  }

  function updatePrintBtn(enabled) {
    var btn = $('printBtn');
    if (!btn) return;
    btn.disabled = !enabled;
    if (typeof btn.setAttribute === 'function') {
      if (!enabled) {
        btn.setAttribute('aria-disabled', 'true');
        btn.setAttribute('title', 'אין אימון להדפסה');
      } else {
        btn.removeAttribute('aria-disabled');
        btn.removeAttribute('title');
      }
    }
  }

  function render() {
    var box = $('sheet');
    var raw = TH.store.get(TH.KEYS.print, null);
    if (raw?.report && raw.report.kind === 'monthly' && TH.monthlyReportHtml) {
      updatePrintBtn(true);
      box.innerHTML = TH.monthlyReportHtml(raw.report, { brand: $('brand').value.trim() });
      $('hint').textContent = 'דוח חודשי מהיומן. שמירה כ־PDF נעשית מחלון ההדפסה של הדפדפן.';
      if ($('backBtn')) { $('backBtn').setAttribute('href', './journal.html'); $('backBtn').textContent = 'חזרה ליומן'; }
      return;
    }
    var packed = currentWorkout();
    if (!packed) {
      box.innerHTML = '<div class="empty" role="status"><p>אין אימון בדפדפן. בנו אימון ואז לחצו «דף להדפסה».</p><a class="th-btn ghost" href="./" style="display:inline-block;margin-top:10px;">בנה אימון עכשיו</a></div>';
      $('hint').textContent = '';
      updatePrintBtn(false);
      return;
    }
    updatePrintBtn(true);
    var brand = $('brand').value.trim();
    var model = TH.workoutPrintModel(packed.workout, { brand: brand, client: packed.client });
    box.innerHTML = TH.workoutPrintHtml(model);
    if (model.branded) {
      $('hint').textContent = 'מסלול מאמן פעיל. השם יופיע בראש הדף. שמירה כ־PDF נעשית מחלון ההדפסה של הדפדפן.';
    } else {
      $('hint').textContent = 'זו גרסת תרגול עם סימן מים. דף ממותג ללקוח נפתח אחרי קוד גישה בדף ההצעה.';
    }
  }

  TH.ready(() => {
    var ent = TH.entitlement();
    var packed = currentWorkout();
    if (ent.brand) $('brand').value = ent.brand;
    else if (packed?.brand) $('brand').value = packed.brand;
    else $('brand').value = savedBrand();
    render();
  });

  $('brandForm').addEventListener('submit', (e) => {
    e.preventDefault();
    var packed = currentWorkout();
    var brand = $('brand').value.trim();
    TH.store.set(TH.KEYS.print, { workout: packed ? packed.workout : null, brand: brand, client: (packed?.client) || '' });
    // On the trainer tier the entitlement brand is read first on load and is
    // the fallback for an empty field, so it has to follow the new name too.
    var ent = TH.entitlement();
    if (ent.tier === 'trainer') TH.setEntitlement({ tier: 'trainer', brand: brand, at: ent.at });
    render();
  });

  $('printBtn').addEventListener('click', function () {
    if (this.disabled || (this.getAttribute && this.getAttribute('aria-disabled') === 'true')) return;
    window.print();
  });
})();
</script>
</body>
</html>
