# TrainerHub — site scan proxy. Free Cloudflare Workers plan.
# No key here on purpose: GEMINI_API_KEY is a secret, set with
#   wrangler secret put GEMINI_API_KEY
# Never add it to this file (it is public) or to [vars].

name = "trainerhub-site-scan"
main = "worker.mjs"
compatibility_date = "2026-01-01"

[vars]
GEMINI_MODEL = "gemini-2.5-flash"
# Extra origins allowed to call the Worker, comma separated. The page on
# https://swissystem7.github.io and http://localhost:* are always allowed.
# ALLOWED_ORIGINS = ""
