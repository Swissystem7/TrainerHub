<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" role="img" aria-label="Plank Exercise Icon">
  <!-- Ground Line -->
  <line x1="8" y1="50" x2="56" y2="50" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="54" x2="52" y2="54" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Forearm & Elbow Grounded -->
  <!-- Upper arm: Shoulder (18, 36) -> Elbow (18, 50) -->
  <line x1="18" y1="36" x2="18" y2="50" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round"/>
  <!-- Forearm on floor: Elbow (18, 50) -> Palm (26, 50) -->
  <line x1="18" y1="50" x2="27" y2="50" stroke="#B9F24A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Toes Braced on Floor -->
  <circle cx="53" cy="48" r="2.5" fill="#2DD4BF"/>

  <!-- Athlete Head (Neutral Spine Alignment) -->
  <circle cx="10" cy="33" r="4.5" fill="#F6F8F6"/>

  <!-- Rigid Core Spine Line (Shoulder -> Hip -> Knees -> Ankle) -->
  <line x1="18" y1="36" x2="36" y2="40" stroke="#B9F24A" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="36" y1="40" x2="53" y2="46" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round"/>

  <!-- Core Isometric Tension Radiance / Pulse -->
  <circle cx="34" cy="40" r="2.5" fill="#B9F24A"/>
  <path d="M30 33 C33 30, 36 30, 39 33" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 27 C33 24, 38 24, 43 27" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
