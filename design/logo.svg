<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="100%" height="100%" fill="none" role="img" aria-label="TrainerHub Logo">
  <defs>
    <linearGradient id="th-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9F24A"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="th-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12211E"/>
      <stop offset="100%" stop-color="#0A1513"/>
    </linearGradient>
    <linearGradient id="th-grad-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#B9F24A"/>
      <stop offset="100%" stop-color="#7FE9D9"/>
    </linearGradient>
    <filter id="th-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Mark Container (Left) -->
  <g transform="translate(14, 10)">
    <!-- Hexagonal Background Shield -->
    <path d="M40 4 L74 22 L74 58 L40 76 L6 58 L6 22 Z" 
          fill="url(#th-grad-bg)" 
          stroke="url(#th-grad-accent)" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>
    
    <!-- Calisthenics Pull-up Bar / Overhead Bar -->
    <line x1="18" y1="24" x2="62" y2="24" 
          stroke="url(#th-grad-bar)" 
          stroke-width="4.5" 
          stroke-linecap="round"/>
    
    <!-- Upright Posts (Bar Rig) -->
    <line x1="24" y1="24" x2="24" y2="60" 
          stroke="#2DD4BF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.5"/>
    <line x1="56" y1="24" x2="56" y2="60" 
          stroke="#2DD4BF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.5"/>

    <!-- Stylized Monogram "T" + "H" + Athletic Athlete Silhouette in Bar Traverse -->
    <!-- Central T stem / Athlete Core -->
    <path d="M40 24 L40 58" 
          stroke="#B9F24A" 
          stroke-width="4.5" 
          stroke-linecap="round"/>
    
    <!-- Crossbar / Parallel Bar grip -->
    <path d="M28 40 L52 40" 
          stroke="url(#th-grad-accent)" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <!-- Dynamic Athletic Slash / Energy Accent -->
    <circle cx="40" cy="18" r="3.5" fill="#B9F24A" filter="url(#th-glow)"/>
    <path d="M32 50 L40 42 L48 50" 
          stroke="#2DD4BF" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Wordmark "TRAINER" + "HUB" -->
  <g transform="translate(108, 22)">
    <!-- Main Brand Name -->
    <text x="0" y="38" 
          font-family="system-ui, -apple-system, 'Heebo', 'Inter', 'Segoe UI', sans-serif" 
          font-weight="900" 
          font-size="34" 
          letter-spacing="0.5" 
          fill="#F6F8F6">TRAINER</text>

    <!-- "HUB" Badge -->
    <g transform="translate(152, 10)">
      <rect x="0" y="0" width="76" height="34" rx="8" 
            fill="url(#th-grad-accent)"/>
      <text x="38" y="24" 
            font-family="system-ui, -apple-system, 'Heebo', 'Inter', 'Segoe UI', sans-serif" 
            font-weight="900" 
            font-size="22" 
            letter-spacing="1" 
            text-anchor="middle" 
            fill="#0A1513">HUB</text>
    </g>

    <!-- Calisthenics Subtitle / Tagline -->
    <text x="1" y="58" 
          font-family="system-ui, -apple-system, 'Heebo', 'Inter', 'Segoe UI', sans-serif" 
          font-weight="600" 
          font-size="11" 
          letter-spacing="3" 
          fill="#7FE9D9">CALISTHENICS &amp; STREET WORKOUT</text>
  </g>
</svg>
