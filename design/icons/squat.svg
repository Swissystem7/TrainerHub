<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" role="img" aria-label="Squat Exercise Icon">
  <!-- Ground Line -->
  <line x1="10" y1="56" x2="54" y2="56" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="59" x2="48" y2="59" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Athlete Head -->
  <circle cx="20" cy="18" r="4.5" fill="#F6F8F6"/>

  <!-- Counter-Balance Arms (Reaching Forward) -->
  <path d="M22 27 L34 26 L44 24" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="24" r="2" fill="#2DD4BF"/>

  <!-- Torso & Spine (Straight Athletic Posture) -->
  <line x1="22" y1="27" x2="26" y2="42" stroke="#B9F24A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Thigh / Femur (Parallel to Ground) -->
  <line x1="26" y1="42" x2="45" y2="42" stroke="#F6F8F6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Shin / Tibia (Angled to Ankle) -->
  <line x1="45" y1="42" x2="38" y2="55" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round"/>

  <!-- Foot Planted on Ground -->
  <path d="M34 55 L44 55" stroke="#B9F24A" stroke-width="3" stroke-linecap="round"/>

  <!-- Squat Depth Guide / Drive Vectors -->
  <path d="M14 36 L14 44" stroke="#7FE9D9" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 42 L14 45 L16 42" stroke="#7FE9D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
