<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" role="img" aria-label="Bar Hang Exercise Icon">
  <!-- Overhead Pull-Up Bar -->
  <line x1="8" y1="12" x2="56" y2="12" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="12" y2="4" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="52" y1="12" x2="52" y2="4" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Hands / Strong Grip Wrap -->
  <circle cx="24" cy="12" r="2.5" fill="#B9F24A"/>
  <circle cx="40" cy="12" r="2.5" fill="#B9F24A"/>

  <!-- Athlete Head (Hanging between active shoulders) -->
  <circle cx="32" cy="22" r="4.5" fill="#F6F8F6"/>

  <!-- Straight Hanging Arms -->
  <line x1="24" y1="12" x2="27" y2="25" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="12" x2="37" y2="25" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round"/>

  <!-- Elongated Torso & Spine -->
  <line x1="32" y1="26" x2="32" y2="42" stroke="#B9F24A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Extended Straight Legs (Full Calisthenics Hang Decompression) -->
  <line x1="31" y1="42" x2="30" y2="60" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="33" y1="42" x2="34" y2="60" stroke="#F6F8F6" stroke-width="3" stroke-linecap="round"/>

  <!-- Grip / Decompression Glow Indicators -->
  <path d="M19 16 L17 18" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <path d="M45 16 L47 18" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 61 L32 63" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
</svg>
